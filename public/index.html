<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve | Dashboard</title>
    <link rel="stylesheet" href="public\asset\style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><h1>Eve</h1></a>
        </div>
        

        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="transactions.html">Transactions</a></li>
                <li><a href="#">Accounts</a></li>
                <li><a href="#">Categories</a></li>
            </ul>
        </nav>

        <div class="addtransaction-btn">
            <button type="button" class="add-transaction" onclick="window.location.href='addtransaction.html'">Add Transaction</button>
        </div>
    </header>

    <section class="summary-cards">
      <div class="summary-card">
        <p class="summary-label">Total balance</p>
        <p class="summary-value" id="total-balance">₱0</p>
        <p class="summary-note">across all accounts</p>
      </div>

      <div class="summary-card">
        <p class="summary-label">Monthly Income</p>
        <p class="summary-value income" id="month-income">₱0</p>
      </div>

      <div class="summary-card">
        <p class="summary-label">Monthly Expenses</p>
        <p class="summary-value" id="month-expenses">₱0</p>
      </div>

      <div class="summary-card">
        <p class="summary-label">Net this month</p>
        <p class="summary-value income" id="month-net">₱0</p>
        <p class="summary-note">income minus expenses</p>
      </div>
    </section>


    <table class="transaction-table">
        <p>Transaction History</p>
        <thead>
            <tr>
                <th>Date</th>
                <th>Description</th>
                <th>Category</th>
                <th>Account</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="transactionTableBody">
        </tbody>
    </table>
</body>
</html>
