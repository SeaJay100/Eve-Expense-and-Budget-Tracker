<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve | Transactions</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><h1>Eve</h1></a>
        </div>
        

        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="transactions.html">Transactions</a></li>
                <li><a href="#">Accounts</a></li>
                <li><a href="#">Categories</a></li>
            </ul>
        </nav>

        <div class="addtransaction-btn">
            <button type="button" class="add-transaction" onclick="window.location.href='addtransaction.html'">Add Transaction</button>
        </div>
    </header>

    <main class="container">
        <section class="page-title">
        <h2>Transactions</h2>
        </section>
        
        <section class="panel">
            <form id="filter-form" class="filter-form">

                <div class="form-group">
                    <label for="filter-category">Category</label>
                    <select id="filter-category" name="category">
                        <option value="">All categories</option>
                        <!-- more options filled by script.js -->
                         <!-- income
                              bills
                              food
                              transportation -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="filter-account">Account</label>
                    <select id="filter-account" name="account">
                        <option value="">All accounts</option>
                        <!-- more options filled by script.js -->
                         <!-- Cash
                              Gcash
                              BDO -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="filter-from">From</label>
                    <input type="date" id="filter-from" name="from">
                </div>

                <div class="form-group">
                    <label for="filter-to">To</label>
                    <input type="date" id="filter-to" name="to">
                </div>

                <button type="submit" class="btn btn-primary">Filter</button>

            </form>
        </section>

        <section class="table-panel">
            <div class="table-container">
                <table class="table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Category</th>
                            <th>Account</th>
                            <th>Amount</th>
                            <th class="amount">Amount</th>
                            <th class="amount">Balance</th>
                            <th class="actions">Actions</th>
                        </tr>
                    </thead>

                    <tbody id="transactionTable-body">
                        <!-- rows are filled by script.js-->
                    </tbody>
                </table>
            </div>
        </section>


    </main>
</body>
</html>
