<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Log in to Eve to see your expenses and budget.">
    <title>Eve</title>
    <link rel="icon" type="image/svg+xml" href="../assets/eve-mark.svg">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <script src="../assets/js/auth-config.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
</head>
<body class="auth-page login-page">
    <main class="auth-shell">
        <section class="auth-intro" aria-labelledby="intro-title">
            <a class="brand" href="../index.html" aria-label="Eve home">
                <span class="brand-mark"><img src="../assets/eve-mark.svg" width="24" height="30" alt=""></span>
                <span>Eve</span>
            </a>
            <div class="intro-copy">
                <h1 id="intro-title">Know where your money goes.</h1>
                <p>Track your spending, plan your monthly budget, and see what’s left.</p>
            </div>
            <figure class="budget-example">
                <figcaption>
                    <span>Monthly budget</span>
                    <span class="example-label">Example</span>
                </figcaption>
                <meter min="0" max="12000" value="8450" aria-label="Example budget spent"></meter>
                <dl class="budget-figures">
                    <div>
                        <dt>Spent</dt>
                        <dd>₱8,450</dd>
                    </div>
                    <div>
                        <dt>Left to spend</dt>
                        <dd>₱3,550</dd>
                    </div>
                </dl>
            </figure>
        </section>
        <section class="auth-card" aria-labelledby="form-title">
            <h2 id="form-title">Log in to Eve</h2>
            <p class="form-description">Use your email and password to open your dashboard.</p>
            <div id="form-message" class="form-message" role="status" aria-live="polite" aria-atomic="true" hidden></div>
            <form id="login-form" class="auth-form">
                <label class="field" for="email">Email address
                    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="username" required>
                </label>
                <label class="field" for="password">Password
                    <span class="password-field">
                        <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
                        <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button>
                    </span>
                </label>
                <button class="auth-submit" type="submit">Log in</button>
            </form>
            <p class="auth-switch">New to Eve? <a href="register.html">Create an account</a></p>
        </section>
    </main>
</body>
</html>
