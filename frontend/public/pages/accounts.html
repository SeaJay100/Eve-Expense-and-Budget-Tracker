<!DOCTYPE html>
<html lang="en" data-session-pending>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve | Accounts</title>
 
    <!-- Styles for the new card feature. If you already have a CSS file,
         move these rules into it. -->
    <style>
        /* Grid layout: new cards fall into the next open slot automatically */
        .account-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
 
        /* Hide the empty grid so only the form shows at first */
        .account-cards:empty {
            display: none;
        }
 
        /* Pop-in animation, plays once when a card is added */
        .account-card {
            animation: pop-in 0.35s ease-out;
        }
 
        @keyframes pop-in {
            from { opacity: 0; transform: scale(0.85) translateY(10px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }
 
        .form-error {
            color: #b3261e;
            font-size: 13px;
            min-height: 1em;
        }
 
        @media (prefers-reduced-motion: reduce) {
            .account-card { animation: none; }
        }
    </style>
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="../assets/js/auth-config.js" defer></script>
    <script src="../assets/js/api.js" defer></script>
    <script src="../assets/js/session.js" defer></script>
    <script src="../assets/js/data.js" defer></script>
</head>
<body>
    <header>
        <div class="logo">
            <a href="../index.html"><h1>Eve</h1></a>
        </div>
 
        <nav class="nav">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="transactions.html">Transactions</a></li>
                <li><a href="accounts.html">Accounts</a></li>
                <li><a href="categories.html">Categories</a></li>
            </ul>
        </nav>
 
        <div class="addtransaction-btn">
            <button type="button" class="add-transaction" onclick="window.location.href='add-transaction.html'">Add Transaction</button>
        </div>
    </header>
 
    <main class="container">
        <section class="page-title">
            <h2>Accounts</h2>
        </section>
 
        <!-- Account cards: empty at first, filled when the user saves an account -->
        <section class="account-cards" id="account-cards" aria-live="polite"></section>
 
        <!-- Add an account -->
        <section class="panel form-panel">
            <h3>Add an account</h3>
 
            <form id="account-form">
 
                <div class="form-group">
                    <label for="account-name">Name</label>
                    <input type="text" id="account-name" name="name" required placeholder="e.g. Maya Wallet">
                </div>
 
                <div class="form-group">
                    <label for="account-type">Type</label>
                    <select id="account-type" name="type">
                        <option value="Cash">Cash</option>
                        <option value="E-wallet">E-wallet</option>
                        <option value="Bank">Bank</option>
                    </select>
                </div>
 
                <div class="form-group">
                    <label for="starting-balance">Starting balance (₱)</label>
                    <input type="text" inputmode="decimal" id="starting-balance" name="startingBalance" required placeholder="0.00">
                </div>
 
                <p class="form-error" id="form-error" role="alert"></p>
 
                <button type="submit" class="btn btn-primary btn-block">Save account</button>
 
            </form>
        </section>
    </main>
 
</body>
</html>
