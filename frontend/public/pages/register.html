<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Create your Eve account to track your everyday money.">
    <title>Eve</title>
    <link rel="icon" type="image/svg+xml" href="../assets/eve-mark.svg">
    <link rel="stylesheet" href="../assets/css/auth.css">
    <script src="../assets/js/auth-config.js" defer></script>
    <script src="../assets/js/auth.js" defer></script>
</head>
<body class="auth-page register-page">
    <main class="auth-shell">
        <section class="auth-intro" aria-labelledby="intro-title">
            <a class="brand" href="../index.html" aria-label="Eve home">
                <span class="brand-mark"><img src="../assets/eve-mark.svg" width="24" height="30" alt=""></span>
                <span>Eve</span>
            </a>
            <div class="intro-copy">
                <h1 id="intro-title">Know where your money goes.</h1>
                <p>Start with the accounts you use every day, then set a budget for the month.</p>
            </div>
        </section>
        <section class="auth-card" aria-labelledby="form-title">
            <h2 id="form-title">Create an account</h2>
            <p class="form-description">Set up your Eve account to start tracking your spending.</p>
            <div id="form-message" class="form-message" role="status" aria-live="polite" aria-atomic="true" hidden></div>
            <form id="register-form" class="auth-form">
                <label class="field" for="name">Your name
                    <input id="name" name="name" type="text" placeholder="Jamie dela Cruz" autocomplete="name" maxlength="80" required>
                </label>
                <label class="field" for="email">Email address
                    <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
                </label>
                <label class="field" for="password">Password
                    <span class="password-field">
                        <input id="password" name="password" type="password" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" maxlength="72" aria-describedby="password-hint" required>
                        <button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false">Show</button>
                    </span>
                    <small id="password-hint">Use at least 8 characters.</small>
                </label>
                <label class="field" for="confirm-password">Confirm password
                    <span class="password-field">
                        <input id="confirm-password" name="confirmPassword" type="password" placeholder="Enter your password again" autocomplete="new-password" required>
                        <button class="password-toggle" type="button" data-password-toggle="confirm-password" aria-label="Show confirm password" aria-pressed="false">Show</button>
                    </span>
                </label>
                <button class="auth-submit" type="submit">Create account</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
        </section>
    </main>
</body>
</html>
