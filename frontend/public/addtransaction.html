<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eve | Add transaction</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">
            <a href="index.html"><h1>Eve</h1></a>
        </div>
        

        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="transactions.html">Transactions</a></li>
                <li><a href="#">Accounts</a></li>
                <li><a href="#">Categories</a></li>
            </ul>
        </nav>

        <div class="addtransaction-btn">
            <button type="button" class="add-transaction" onclick="window.location.href='addtransaction.html'">Add Transaction</button>
        </div>
    </header>

    <main class="addtransaction-container">
        <section class="addtransaction-title">
        <h2>Add transaction</h2>
        <p>Record an expense or income.</p>
        </section>

        <section class="addtransaction-panel">
            <form id ="transaction-form">
                <fieldset class="transaction-type">
                    <legend>Type</legend>
                    <label>
                        <input type="radio" name="type" value="expense" checked> Expense
                    </label>
                    <label>
                        <input type="radio" name="type" value="income"> Income
                    </label>
                </fieldset>

                <div class="form-group">
                    <label for="amount">Amount (₱)</label>
                    <input type="number" id="amount" name="amount" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" name="description" placeholder="e.g. Lunch with team">
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date">
                </div>

                <div class="form-group">
                    <label for="account">Account</label>
                    <select id="account" name="account">
                        <option value="">Choose an account</option>
                        <!-- more options filled by script.js -->
                        <!-- Cash
                             Gcash
                             BDO -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category">
                        <option value="">Choose a category</option>
                        <!-- more options filled by script.js -->
                         <!-- income
                              bills
                              food
                              transportation -->
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save transaction</button>
                    <a href="/pages/transactions.html" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </section>
    
    </main>
</body>
</html>
